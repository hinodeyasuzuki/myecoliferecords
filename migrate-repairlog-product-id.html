<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>修理履歴データ移行ツール - equip_id → product_id</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1d21;
    --muted: #5b6270;
    --card: #f6f7f9;
    --border: #e2e5ea;
    --accent: #1a6b4a;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --fg: #eceef0; --muted: #9aa2ad; --card: #1c2024;
      --border: #2b3036; --accent: #4fbf8e; --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { margin-bottom: 0.3em; }
  .card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    background: var(--card);
  }
  button {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.95rem;
    margin-right: 8px;
  }
  button.secondary {
    background: var(--bg);
    color: var(--fg);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status { white-space: pre-wrap; font-size: 0.9em; }
  .status.ok { color: var(--accent); }
  .status.warn { color: var(--danger); }
  .muted { color: var(--muted); font-size: 0.9em; }
  code { background: var(--bg); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <h1>修理履歴データ移行ツール</h1>
  <p class="muted">localStorageに保存された修理履歴データの <code>equip_id</code> フィールドを、新しい仕様の <code>product_id</code> に変換します。このページは本アプリと同じオリジンで開いてください。</p>

  <div class="card">
    <h2>1. 現在の状態を確認</h2>
    <p id="check-status" class="status">「確認する」を押してください。</p>
    <button id="check-btn">確認する</button>
  </div>

  <div class="card">
    <h2>2. バックアップをダウンロード</h2>
    <p class="muted">変換前に、念のため現在のデータをバックアップとして保存できます。</p>
    <button id="backup-btn" disabled>バックアップをダウンロード</button>
  </div>

  <div class="card">
    <h2>3. 変換を実行</h2>
    <p class="muted">修理履歴の <code>equip_id</code> を <code>product_id</code> にリネームして、localStorageに保存し直します。</p>
    <button id="migrate-btn" disabled>変換して保存する</button>
    <p id="migrate-status" class="status"></p>
  </div>
</main>
<script>
  const STORAGE_KEY = "homeenergycodes.savedInput";

  const checkStatusEl = document.getElementById("check-status");
  const migrateStatusEl = document.getElementById("migrate-status");
  const checkBtn = document.getElementById("check-btn");
  const backupBtn = document.getElementById("backup-btn");
  const migrateBtn = document.getElementById("migrate-btn");

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (err) {
      throw new Error("保存データの解析に失敗しました: " + err.message);
    }
  }

  function countTargets(data) {
    const repairlog = (data && data.repairlog) || {};
    let toMigrate = 0;
    let alreadyDone = 0;
    for (const log of Object.values(repairlog)) {
      if (log.product_id === undefined && log.equip_id !== undefined) {
        toMigrate++;
      } else if (log.product_id !== undefined) {
        alreadyDone++;
      }
    }
    return { total: Object.keys(repairlog).length, toMigrate, alreadyDone };
  }

  function setStatus(el, text, cls) {
    el.textContent = text;
    el.className = "status" + (cls ? " " + cls : "");
  }

  checkBtn.addEventListener("click", () => {
    let data;
    try {
      data = loadData();
    } catch (err) {
      setStatus(checkStatusEl, err.message, "warn");
      return;
    }
    if (!data) {
      setStatus(checkStatusEl, "localStorageに保存データが見つかりませんでした。", "warn");
      backupBtn.disabled = true;
      migrateBtn.disabled = true;
      return;
    }
    const { total, toMigrate, alreadyDone } = countTargets(data);
    setStatus(
      checkStatusEl,
      `修理履歴: ${total}件中\n・変換対象(equip_id あり): ${toMigrate}件\n・変換済み(product_id あり): ${alreadyDone}件`,
      toMigrate > 0 ? "warn" : "ok"
    );
    backupBtn.disabled = false;
    migrateBtn.disabled = toMigrate === 0;
  });

  backupBtn.addEventListener("click", () => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const blob = new Blob([raw], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const ts = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = url;
    a.download = `myecoliferecords-backup-${ts}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  migrateBtn.addEventListener("click", () => {
    let data;
    try {
      data = loadData();
    } catch (err) {
      setStatus(migrateStatusEl, err.message, "warn");
      return;
    }
    if (!data || !data.repairlog) {
      setStatus(migrateStatusEl, "修理履歴データが見つかりませんでした。", "warn");
      return;
    }
    let migrated = 0;
    for (const log of Object.values(data.repairlog)) {
      if (log.product_id === undefined && log.equip_id !== undefined) {
        log.product_id = log.equip_id;
        delete log.equip_id;
        migrated++;
      }
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    setStatus(migrateStatusEl, `${migrated}件の修理履歴を product_id に変換し、保存しました。`, "ok");
    migrateBtn.disabled = true;
    checkBtn.click();
  });

  checkBtn.click();
</script>
</body>
</html>
