<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Myエコライフ記録 - My EcoLife Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon.ico">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1d21;
    --muted: #5b6270;
    --card: #f6f7f9;
    --border: #e2e5ea;
    --accent: #1a6b4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --fg: #eceef0; --muted: #9aa2ad; --card: #1c2024;
      --border: #2b3036; --accent: #4fbf8e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  nav.tabs button {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); color: var(--fg); cursor: pointer; font-size: 0.95rem;
  }
  nav.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #top-tab .top-action-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 16px 0 24px;
  }
  #top-tab .top-action-card {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
  }
  #top-tab .top-action-card h3 {
    margin: 0 0 8px;
  }
  #top-tab .top-action-card p {
    margin: 0 0 8px;
  }
  #top-tab .top-action-card p:last-child {
    margin-bottom: 0;
  }
  @media (max-width: 768px) {
    #top-tab .top-action-grid {
      grid-template-columns: 1fr;
    }
  }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  input[type="text"], input[type="number"], select, textarea {
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
    background: #ffd; color: var(--fg);
    font-size:1.0em;
  }
  button { cursor: pointer; }
  .toolbar { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  span.guide-toggle {
    background: transparent;
    color: var(--accent);
    text-decoration: underline;
    padding: 4px 2px;
    cursor: pointer;
  }
  span.open{
    color: red;
    font-weight: bold;
  }
  h1{
    margin-bottom: 0.5em;
    margin-top: 0;
    background: linear-gradient(to right, #ff8, var(--card));
  }
  .highlighted { outline: 2px solid var(--accent); }
  .rowtitle {
    display: inline-block;
    width: 100px;
    font-weight: bold;
    vertical-align: top;
  }
  input[type="button"].highlighted { background: var(--accent) !important; color: #fff; border-color: var(--accent); }
  input[type="number"] { text-align: right;width:6em; }

  table.equip-table{
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    background: var(--card);
    overflow: hidden;
  }
  th{
    background: var(--card);
  }
  .table-sortable {
    cursor: pointer;
  }
  .equip-table-sm{
    display: none;
  }
  .enduse {
    background: #e6e7e6;
  }
  .rowtitlepadding{
    padding-left:100px;
    text-indent:-100px;
  }
  .rowtitlepadding .rowtitle{
    position:relative;
    left:100px;
  }
  textarea.memory {
    display: inline-block;
    width: calc(100% - 8em);
    font-size: 1.2em;
    height: 4em;
  }

  #energy-table .item {
    width:80px;
  }
  #energy-table .amount {
    width: calc(50% - 40px);
  }
  #energy-table input[type="number"] {
    width: calc(100% - 3em);
  }
  .outershare {
    margin-top: 20px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
  }
  .outershare .graph-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 12px;
  }
  .outershare .graph-controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.92em;
  }
  .outershare .graph-card {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }
  .outershare .energy-chart {
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
  }
  .outershare .chart-caption {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 0.9em;
  }
  .outershare .chart-legend {
    display: grid;
    gap: 6px;
    padding-left: 0;
    margin: 10px 0 0;
    list-style: none;
    font-size: 0.9em;
  }
  .outershare .legend-color {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 6px;
    border-radius: 3px;
  }
  #input-tab .rowtitle {
    width: 60%;
    display: inline-block;
    vertical-align: top;
  }
  #input-tab .rowvalue {
    width: 38%;
    padding-left: 2%;
    display: inline-block;
    vertical-align: top;
  }
  #input-tab .input-group-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #products-tab .equip-table input[type="button"] {
    display: inline-block;
    border-radius: 6px;
    padding: 3px;
    margin-bottom: 3px;
    margin-right: 3px;
  }
  #products-tab .category button{
    display:inline-block;
    vertical-align: top;
    align-items: center;
    width:11% ;
    min-height:50px;
    border-radius: 6px;
    padding: 3px;
    margin-bottom: 3px; 
  }

   #products-tab .up{
    text-decoration: underline;
    cursor: pointer;
    color:blue;
   }

  #picture-tab .picture-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
  }
  #picture-tab .picture-thumb {
    display: block;
    max-width: 640px;
    max-height: 640px;
    margin-bottom: 8px;
  }
  .picture-thumb-sm {
    display: inline-block;
    max-width: 180px;
    max-height: 180px;
    vertical-align: middle;
    margin-right: 6px;
  }
  .picture-thumb-xs {
    display: inline-block;
    max-width: 32px;
    max-height: 32px;
    vertical-align: middle;
    margin-right: 6px;
  }
  #picture-tab .picture-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  #picture-tab .picture-tile {
    width: 200px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
  }
  #picture-tab .picture-tile img.picture-thumb-sm {
    display: block;
    margin: 0 auto 6px;
    max-width: 180px;
    max-height: 180px;
  }
  #picture-tab .picture-thumb-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 180px;
    height: 180px;
    margin: 0 auto 6px;
    border: 1px dashed var(--border);
    border-radius: 4px;
    color: var(--muted);
    font-size: 0.85em;
  }
  #picture-tab .picture-tile-memo {
    margin: 0;
    font-size: 0.9em;
    word-break: break-all;
  }
  #picture-tab .picture-tile-date {
    margin: 4px 0 0;
    font-size: 0.8em;
    color: var(--muted);
  }

  #setting-tab div{
    margin-left:1em;
  }
  .hide_pc { display: none; }



  @media (max-width: 600px) {
    #input-tab .rowtitle {
      width: 100%;
    }
    #input-tab .rowvalue {
      width: 100%;
      text-align: right;
    }
    main { padding: 5px 5px 60px; }
    .hide_sm { display: none; }
    .hide_pc { display: inline; }

  }
  @media (max-width: 660px) {
    #room-tab input[type="text"] {
      width:6em;
    }
    #room-tab input[type="number"] {
      width:4em;
    }
  }
  @media (max-width: 920px) {
    .equip-table-sm{
      display: block;
      padding:10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      overflow: hidden;
    }
  }


</style>
</head>
<body>
<main id="app">
  <h1>Myエコライフ記録</h1>
  <p v-if="loading">読み込み中...</p>
  <template v-else>
    <nav class="tabs">
      <button
        v-for="t in tabs"
        :key="t.id"
        :class="{active: currentTab === t.id}"
        @click="currentTab = t.id"
      >{{ t.label }}</button>
    </nav>

    <tab-input v-if="currentTab === 'input'" :data="data" :master="master"></tab-input>
    <tab-top v-if="currentTab === 'top'" :data="data"></tab-top>
    <tab-room v-if="currentTab === 'room'" :data="data"></tab-room>
    <tab-products
      v-if="currentTab === 'products'"
      :data="data"
      :master="master"
      :highlight-id="highlight.product"
      @consumed-highlight="clearProductHighlight"
      @jump-repairlog="jumpToRepairlog"
      @jump-picture="jumpToPicture"
    ></tab-products>
    <tab-energy v-if="currentTab === 'energy'" :data="data" :master="master"></tab-energy>
    <tab-repairlog
      v-if="currentTab === 'repairlog'"
      :data="data"
      :highlight-id="highlight.repairlog"
      @consumed-highlight="clearRepairlogHighlight"
      @jump-picture="jumpToPicture"
      @jump-product="jumpToProduct"
    ></tab-repairlog>
    <tab-picture
      v-if="currentTab === 'picture'"
      :data="data"
      :highlight-id="highlight.picture"
      @consumed-highlight="clearPictureHighlight"
    ></tab-picture>
    <tab-setting
      v-if="currentTab === 'setting'"
      @export-json="exportJson"
      @import-json="importJson"
    ></tab-setting>
  </template>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
