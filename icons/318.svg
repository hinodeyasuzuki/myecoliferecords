<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CB93B4"/>
      <stop offset="1" stop-color="#7A4468"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#b7bbc2"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#472339" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#472339" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="30" width="20" height="16" rx="3" fill="url(#tank)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="21" cy="48" r="3" fill="#8a8f98" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="31" cy="48" r="3" fill="#8a8f98" stroke="#3a3d42" stroke-width="1"/>
    <path d="M36 34 q10 -2 12 6" fill="none" stroke="#3a3d42" stroke-width="2"/>
    <path d="M46 38 l6 4" stroke="#3a3d42" stroke-width="2"/>
    <path d="M50 40 l4 -3 3 2 -3 5 z" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <line x1="20" y1="30" x2="20" y2="22" stroke="#3a3d42" stroke-width="2"/>
    <line x1="32" y1="30" x2="32" y2="22" stroke="#3a3d42" stroke-width="2"/>
    <rect x="17" y="18" width="18" height="4" rx="1.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
