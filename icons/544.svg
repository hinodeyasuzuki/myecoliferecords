<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB72"/>
      <stop offset="1" stop-color="#B37D1E"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4008" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4008" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="30" cy="32" r="17" fill="none" stroke="#2E8B57" stroke-width="4"/>
    <circle cx="30" cy="32" r="12" fill="none" stroke="#2E8B57" stroke-width="4"/>
    <circle cx="30" cy="32" r="7" fill="none" stroke="#2E8B57" stroke-width="4"/>
    <rect x="12" y="30" width="6" height="4" rx="1" fill="url(#body)" stroke="#3a3d42" stroke-width="1"/>
    <path d="M44 25 q10 2 10 8 q0 4 -6 5" fill="none" stroke="#2E8B57" stroke-width="4" stroke-linecap="round"/>
    <rect x="46" y="36" width="10" height="4" rx="1" fill="url(#body)" stroke="#3a3d42" stroke-width="1"/>
  </g>
</svg>
