<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA07E"/>
      <stop offset="1" stop-color="#C94E2C"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c2312" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2312" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="18" y="14" width="28" height="38" rx="6" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="22" y="18" width="20" height="12" rx="2" fill="#20232a"/>
    <circle cx="28" cy="23" r="1.4" fill="#ffa07e"/>
    <circle cx="36" cy="23" r="1.4" fill="#ffa07e"/>
    <path d="M28 27 q4 3 8 0" fill="none" stroke="#ffa07e" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="26" cy="38" r="3" fill="#c94e2c"/>
    <circle cx="38" cy="38" r="3" fill="#5fc4b5"/>
    <circle cx="32" cy="45" r="3" fill="#f0c868"/>
  </g>
</svg>
