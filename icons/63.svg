      <circle cx="34" cy="16" r="0.9"/><circle cx="38" cy="15.5" r="0.9"/><circle cx="42" cy="16.5" r="0.9"/>
      <circle cx="35.5" cy="19.5" r="0.9"/><circle cx="39.5" cy="19.5" r="0.9"/>
    </g>
    <path d="M30 20 q-14 8 -8 26" fill="none" stroke="#c7ccd1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M30 20 q-14 8 -8 26" fill="none" stroke="#3a3d42" stroke-width="0.8" stroke-linecap="round"/>
    <rect x="10" y="45" width="10" height="6" rx="2" fill="#e6e9ec" stroke="#3a3d42" stroke-width="1"/>
