<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="14" y="34" width="14" height="16" rx="3" fill="#e8ecef" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M17 34 C17 28 20 24 24 24 C28 24 30 28 30 32" fill="none" stroke="#3a3d42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="21" cy="42" r="2.6" fill="#F5CB72" stroke="#5c4008" stroke-width="0.8"/>
    <circle cx="46" cy="40" r="10" fill="#e8ecef" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="46" cy="40" r="6" fill="none" stroke="#305674" stroke-width="1"/>
    <rect x="43" y="24" width="6" height="8" rx="1.5" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1"/>
    <rect x="44.5" y="26" width="3" height="4" fill="#9cc4e0"/>
