    <rect x="46" y="20" width="6" height="26" rx="2" fill="url(#wood)" stroke="#4a3320" stroke-width="1.2"/>
    <rect x="12" y="26" width="40" height="10" rx="2" fill="url(#wood)" stroke="#4a3320" stroke-width="1.2"/>
    <rect x="16" y="20" width="10" height="8" rx="2" fill="#eef2f6" stroke="#3a3d42" stroke-width="1"/>
    <path d="M18 36 h34 v10 q0 3 -3 3 h-31 q-3 0 -3 -3 z" fill="url(#blanket)" stroke="#3a3d42" stroke-width="1.1"/>
    <path d="M18 40 q17 3 34 0" fill="none" stroke="#9aa0aa" stroke-width="0.8"/>
    <line x1="12" y1="46" x2="12" y2="52" stroke="#4a3320" stroke-width="2"/>
    <line x1="52" y1="46" x2="52" y2="52" stroke="#4a3320" stroke-width="2"/>
