<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BC97"/>
      <stop offset="1" stop-color="#566B4F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <radialGradient id="lens" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#e3c66a"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#28351f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#28351f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="32" cy="30" r="19" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="30" r="13" fill="url(#lens)" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="32" cy="30" r="7" fill="#fffdf2" opacity="0.8"/>
    <path d="M32 49 l-3 8 h6 z" fill="none" stroke="#f5cb72" stroke-width="1.3" opacity="0.7"/>
    <path d="M22 46 l-4 6" stroke="#f5cb72" stroke-width="1.3" opacity="0.6" stroke-linecap="round"/>
    <path d="M42 46 l4 6" stroke="#f5cb72" stroke-width="1.3" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>
