    <path d="M14 30 a18 16 0 0 1 36 0 z" fill="url(#canopy)" stroke="#472339" stroke-width="1.3"/>
    <path d="M14 30 q4 4 8 0 q4 4 8 0 q4 4 8 0 q4 4 8 0" fill="none" stroke="#472339" stroke-width="1"/>
    <line x1="32" y1="14" x2="32" y2="48" stroke="#8a8f98" stroke-width="2"/>
    <path d="M32 48 q0 4 4 4" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
