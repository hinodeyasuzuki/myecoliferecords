<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f0f7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bcd0e0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="0.5" stop-color="#cdeadf"/>
      <stop offset="1" stop-color="#9aa0aa"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="14" y="12" width="36" height="40" rx="2" fill="url(#case)" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="15" fill="url(#disc)" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="4" fill="#eef0f2" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="32" cy="32" r="1.4" fill="#3a3d42"/>
  </g>
</svg>
