<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FC4B5"/>
      <stop offset="1" stop-color="#1F6F64"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0d2b26" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#123c35" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="10" width="32" height="42" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <line x1="21" y1="10" x2="21" y2="52" stroke="#aeb4bb" stroke-width="1"/>
    <line x1="27" y1="10" x2="27" y2="52" stroke="#aeb4bb" stroke-width="1"/>
    <line x1="33" y1="10" x2="33" y2="52" stroke="#aeb4bb" stroke-width="1"/>
    <line x1="39" y1="10" x2="39" y2="52" stroke="#aeb4bb" stroke-width="1"/>
    <line x1="43" y1="10" x2="43" y2="52" stroke="#aeb4bb" stroke-width="1"/>
    <rect x="16" y="10" width="32" height="42" rx="2" fill="none" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="31" r="2.6" fill="#9aa0aa" stroke="#3a3d42" stroke-width="0.8"/>
    <line x1="30.6" y1="29.6" x2="33.4" y2="32.4" stroke="#3a3d42" stroke-width="0.7"/>
    <line x1="33.4" y1="29.6" x2="30.6" y2="32.4" stroke="#3a3d42" stroke-width="0.7"/>
  </g>
</svg>
