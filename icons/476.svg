<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="20" cy="42" r="5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <circle cx="44" cy="42" r="5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <ellipse cx="32" cy="44" rx="14" ry="10" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="22" cy="16" r="5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="42" cy="16" r="5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="32" cy="26" r="12" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="28" cy="24" r="1.3" fill="#305674"/>
    <circle cx="36" cy="24" r="1.3" fill="#305674"/>
    <ellipse cx="32" cy="29" rx="3" ry="2" fill="#305674"/>
  </g>
</svg>
