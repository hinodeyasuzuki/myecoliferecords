<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BC97"/>
      <stop offset="1" stop-color="#566B4F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d8b1"/>
      <stop offset="1" stop-color="#566B4F"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#28351f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#28351f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <path d="M20 48 l3 -9 18 -18 6 6 -18 18z" fill="url(#pen)" stroke="#28351f" stroke-width="1.2"/>
    <path d="M23 39 l6 6" stroke="#28351f" stroke-width="1.1"/>
    <path d="M20 48 l-3 4 4 -3z" fill="#28351f"/>
    <path d="M41 21 l6 -6 3 3 -6 6z" fill="#e7e9eb" stroke="#28351f" stroke-width="1.1"/>
    <rect x="16" y="18" width="4" height="18" rx="1.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1" transform="rotate(20 18 27)"/>
  </g>
</svg>
