    <path d="M14 46 L34 22" stroke="#3a3d42" stroke-width="4.6" stroke-linecap="round" opacity="0" />
    <path d="M50 46 L30 22" stroke="#8a8f98" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="3.4" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M12 44 l6 6 4 -3 -6 -6z" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M52 44 l-6 6 -4 -3 6 -6z" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
  </g>
