    <line x1="21" y1="22" x2="21" y2="46" stroke="#c7ccd1" stroke-width="0.7"/>
    <line x1="28" y1="22" x2="28" y2="46" stroke="#c7ccd1" stroke-width="0.7"/>
    <line x1="35" y1="22" x2="35" y2="46" stroke="#c7ccd1" stroke-width="0.7"/>
