<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="14" y="12" width="36" height="36" fill="none" stroke="url(#body)" stroke-width="4"/>
    <rect x="14" y="12" width="36" height="36" fill="none" stroke="#3a3d42" stroke-width="1"/>
    <line x1="14" y1="12" x2="50" y2="48" stroke="#e6e9ec" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="14" y1="12" x2="50" y2="48" stroke="#3a3d42" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="27" y="27" width="10" height="6" rx="1.5" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1" transform="rotate(45 32 30)"/>
  </g>
</svg>
