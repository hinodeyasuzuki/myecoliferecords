<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="15" y="9" width="34" height="44" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="19" y="13" width="26" height="8" rx="1.5" fill="#20262f" stroke="#12161c" stroke-width="1"/>
    <rect x="21" y="15.3" width="8" height="3.4" rx="0.8" fill="#7fd48a"/>
    <circle cx="41" cy="17" r="1.5" fill="#7fd48a"/>
    <rect x="19" y="25" width="26" height="24" rx="1.5" fill="#e6e9ec" stroke="#9aa0aa" stroke-width="1"/>
    <line x1="24" y1="30" x2="24" y2="44" stroke="#c7ccd1" stroke-width="1.4"/>
    <line x1="32" y1="30" x2="32" y2="44" stroke="#c7ccd1" stroke-width="1.4"/>
    <line x1="40" y1="30" x2="40" y2="44" stroke="#c7ccd1" stroke-width="1.4"/>
  </g>
</svg>
