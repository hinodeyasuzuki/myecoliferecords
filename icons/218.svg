<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="12" width="6" height="34" rx="1.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <rect x="24" y="12" width="6" height="34" rx="1.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <rect x="32" y="12" width="6" height="34" rx="1.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <rect x="40" y="12" width="6" height="34" rx="1.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <rect x="14" y="46" width="34" height="5" rx="2" fill="#8a8f98" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="18" cy="54" r="2.6" fill="#3a3d42"/>
    <circle cx="44" cy="54" r="2.6" fill="#3a3d42"/>
  </g>
</svg>
