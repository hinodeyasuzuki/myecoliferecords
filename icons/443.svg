<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FC4B5"/>
      <stop offset="1" stop-color="#1F6F64"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0d2b26" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#123c35" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="14" y="12" width="36" height="24" rx="2.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="17" y="15" width="30" height="18" fill="#20232a"/>
    <rect x="28" y="36" width="8" height="8" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1"/>
    <rect x="22" y="44" width="20" height="4" rx="1.5" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1"/>
  </g>
</svg>
