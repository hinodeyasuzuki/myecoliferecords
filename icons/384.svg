<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3B8"/>
      <stop offset="1" stop-color="#455A72"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6d5e2"/>
      <stop offset="1" stop-color="#455A72"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#233040" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#233040" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="22" width="32" height="20" rx="3" fill="url(#body)" stroke="#233040" stroke-width="1.3"/>
    <rect x="16" y="30" width="32" height="12" rx="2" fill="url(#sand)" stroke="#233040" stroke-width="1"/>
    <circle cx="22" cy="35" r="0.8" fill="#233040"/>
    <circle cx="28" cy="38" r="0.8" fill="#233040"/>
    <circle cx="34" cy="34" r="0.8" fill="#233040"/>
    <circle cx="40" cy="37" r="0.8" fill="#233040"/>
    <circle cx="44" cy="33" r="0.8" fill="#233040"/>
  </g>
</svg>
