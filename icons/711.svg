    <rect x="30" y="13" width="4" height="12" fill="#F5CB72" stroke="#3a3d42" stroke-width="0.7"/>
    <rect x="35" y="16" width="4" height="9" fill="#8FAE7A" stroke="#3a3d42" stroke-width="0.7"/>
    <rect x="40" y="13" width="4" height="12" fill="#f6f7f8" stroke="#3a3d42" stroke-width="0.7"/>
