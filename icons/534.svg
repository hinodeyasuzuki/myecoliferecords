    <path d="M24 22 q8 -10 16 0" fill="none" stroke="#9aa0aa" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="12" y="22" width="40" height="28" rx="6" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="18" y="27" width="20" height="18" rx="9" fill="#eef0f2" stroke="#3a3d42" stroke-width="1"/>
    <line x1="22" y1="30" x2="34" y2="42" stroke="#c7ccd1" stroke-width="0.6"/>
    <line x1="22" y1="36" x2="34" y2="36" stroke="#c7ccd1" stroke-width="0.6"/>
    <line x1="22" y1="42" x2="34" y2="30" stroke="#c7ccd1" stroke-width="0.6"/>
    <rect x="42" y="30" width="6" height="12" rx="1" fill="#C4922A" stroke="#3a3d42" stroke-width="0.8"/>
