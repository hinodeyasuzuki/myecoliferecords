<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0AD84"/>
      <stop offset="1" stop-color="#A85830"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c2c14" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2c14" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <path d="M16 34 a16 15 0 0 1 32 0" fill="none" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="14" y="34" width="36" height="18" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <line x1="18" y1="20.5" x2="18" y2="52" stroke="#8a8f98" stroke-width="1.1"/>
    <line x1="24" y1="16.5" x2="24" y2="52" stroke="#8a8f98" stroke-width="1.1"/>
    <line x1="32" y1="15" x2="32" y2="52" stroke="#8a8f98" stroke-width="1.1"/>
    <line x1="40" y1="16.5" x2="40" y2="52" stroke="#8a8f98" stroke-width="1.1"/>
    <line x1="46" y1="20.5" x2="46" y2="52" stroke="#8a8f98" stroke-width="1.1"/>
  </g>
