    <rect x="38" y="19" width="6" height="3" rx="1.5" fill="#8fa3b8" stroke="#3a3d42" stroke-width="0.8"/>
    <path d="M20 38 h24 l-3 12 h-18 z" fill="#e6e9ec" stroke="#3a3d42" stroke-width="1.1"/>
