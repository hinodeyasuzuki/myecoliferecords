<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CB93B4"/>
      <stop offset="1" stop-color="#7A4468"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#472339" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#472339" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="10" width="20" height="20" fill="#f6f7f8" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="34" cy="34" r="20" fill="#1c1c1c" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="34" cy="34" r="16" fill="none" stroke="#3a3a3a" stroke-width="0.6"/>
    <circle cx="34" cy="34" r="13" fill="none" stroke="#3a3a3a" stroke-width="0.6"/>
    <circle cx="34" cy="34" r="10" fill="none" stroke="#3a3a3a" stroke-width="0.6"/>
    <circle cx="34" cy="34" r="7" fill="#CB93B4" stroke="#472339" stroke-width="1"/>
    <circle cx="34" cy="34" r="1.6" fill="#20141c"/>
  </g>
</svg>
