<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C868"/>
      <stop offset="1" stop-color="#C4922A"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4108" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4108" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <ellipse cx="32" cy="34" rx="21" ry="14" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <ellipse cx="32" cy="34" rx="15" ry="9" fill="none" stroke="#9aa0aa" stroke-width="1"/>
    <path d="M46 40 q6 2 6 8" fill="none" stroke="#3a3d42" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="50" y="47" width="7" height="5" rx="1.5" fill="#eef0f2" stroke="#3a3d42" stroke-width="1"/>
  </g>
</svg>
