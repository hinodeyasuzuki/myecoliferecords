<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87BB9"/>
      <stop offset="1" stop-color="#613461"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3a1e3a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#3a1e3a" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="14" width="34" height="34" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <line x1="18.7" y1="14" x2="18.7" y2="48" stroke="#9aa0aa" stroke-width="0.8"/>
    <line x1="27.3" y1="14" x2="27.3" y2="48" stroke="#9aa0aa" stroke-width="0.8"/>
    <line x1="36" y1="14" x2="36" y2="48" stroke="#9aa0aa" stroke-width="0.8"/>
    <line x1="10" y1="25.3" x2="44" y2="25.3" stroke="#9aa0aa" stroke-width="0.8"/>
    <line x1="10" y1="36.7" x2="44" y2="36.7" stroke="#9aa0aa" stroke-width="0.8"/>
    <g transform="rotate(-14 46 44)">
      <rect x="38" y="36" width="16" height="16" rx="3" fill="#f6f7f8" stroke="#3a3d42" stroke-width="1.3"/>
      <circle cx="42.5" cy="40.5" r="1.2" fill="#613461"/>
      <circle cx="49.5" cy="47.5" r="1.2" fill="#613461"/>
      <circle cx="46" cy="44" r="1.2" fill="#613461"/>
    </g>
  </g>
