<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB72"/>
      <stop offset="1" stop-color="#B37D1E"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dae0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4008" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4008" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="20" fill="url(#glow)"/>
    <ellipse cx="32" cy="30" rx="17" ry="7" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <ellipse cx="32" cy="30" rx="10" ry="4" fill="#fff3c4" stroke="#c9a03f" stroke-width="0.8"/>
    <path d="M20 30 q0 8 12 10 q12 -2 12 -10" fill="none" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="30" y="18" width="4" height="4" rx="1" fill="#c7ccd1" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
