    <rect x="30" y="44" width="14" height="8" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <line x1="37" y1="52" x2="37" y2="55" stroke="#3a3d42" stroke-width="1.3"/>
