<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FAE7A"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#26331c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#26331c" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="32" width="40" height="14" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="18" cy="39" r="1.5" fill="#5cd66b"/>
    <circle cx="24" cy="39" r="1.5" fill="#5cd66b"/>
    <circle cx="30" cy="39" r="1.5" fill="#8a8f98"/>
    <line x1="24" y1="32" x2="20" y2="14" stroke="#8a8f98" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="32" x2="44" y2="14" stroke="#8a8f98" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="12" r="1.8" fill="#dfe2e6" stroke="#3a3d42" stroke-width="0.7"/>
    <circle cx="44" cy="12" r="1.8" fill="#dfe2e6" stroke="#3a3d42" stroke-width="0.7"/>
  </g>
</svg>
