<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97B8A"/>
      <stop offset="1" stop-color="#7A2E3F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#421a23" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#421a23" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="14" width="40" height="34" rx="2.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="15" y="22" width="34" height="23" rx="1.5" fill="#2c333b" stroke="#12161c" stroke-width="1"/>
    <rect x="17.5" y="24.5" width="29" height="18" rx="1" fill="#4a5561" opacity="0.7"/>
    <circle cx="19" cy="18" r="2.4" fill="#e6e9ec" stroke="#3a3d42" stroke-width="0.7"/>
    <circle cx="27" cy="18" r="2.4" fill="#e6e9ec" stroke="#3a3d42" stroke-width="0.7"/>
    <circle cx="45" cy="18" r="2.4" fill="#e6e9ec" stroke="#3a3d42" stroke-width="0.7"/>
    <rect x="27" y="45" width="10" height="2.4" rx="1" fill="#c7ccd1"/>
  </g>
</svg>
