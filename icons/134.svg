<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3B8"/>
      <stop offset="1" stop-color="#455A72"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c48d"/>
      <stop offset="1" stop-color="#c79a5c"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#233040" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#233040" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="16" width="34" height="26" rx="4" fill="url(#wood)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="41" cy="21" r="2.2" fill="#a97c3f" stroke="#3a3d42" stroke-width="0.8"/>
    <line x1="16" y1="34" x2="42" y2="34" stroke="#b98c52" stroke-width="1"/>
    <path d="M46 42 l6 10 h-8 z" fill="url(#wood)" stroke="#3a3d42" stroke-width="1"/>
    <line x1="16" y1="24" x2="38" y2="24" stroke="#d8ad72" stroke-width="0.8"/>
  </g>
</svg>
