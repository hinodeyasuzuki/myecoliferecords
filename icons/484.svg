<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3B8"/>
      <stop offset="1" stop-color="#455A72"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#233040" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#233040" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="21" y="10" width="22" height="30" rx="2.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="19" r="6" fill="#3a3d42"/>
    <circle cx="32" cy="19" r="3.6" fill="#5a5f68"/>
    <rect x="24" y="28" width="16" height="8" fill="#20232a"/>
    <line x1="32" y1="40" x2="32" y2="50" stroke="#3a3d42" stroke-width="2"/>
    <line x1="32" y1="50" x2="22" y2="56" stroke="#3a3d42" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="50" x2="42" y2="56" stroke="#3a3d42" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="50" x2="32" y2="58" stroke="#3a3d42" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
