<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BC97"/>
      <stop offset="1" stop-color="#566B4F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1de"/>
      <stop offset="1" stop-color="#e3cda1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#28351f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#28351f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="9" y="20" width="46" height="12" rx="6" fill="url(#fut)" stroke="#7a6236" stroke-width="1.2"/>
    <rect x="9" y="33" width="46" height="12" rx="6" fill="url(#fut)" stroke="#7a6236" stroke-width="1.2"/>
    <line x1="12" y1="26" x2="52" y2="26" stroke="#c7a86c" stroke-width="0.8"/>
    <line x1="12" y1="39" x2="52" y2="39" stroke="#c7a86c" stroke-width="0.8"/>
    <rect x="21" y="16" width="4" height="34" fill="#566B4F" stroke="#28351f" stroke-width="0.9"/>
    <rect x="39" y="16" width="4" height="34" fill="#566B4F" stroke="#28351f" stroke-width="0.9"/>
  </g>
</svg>
