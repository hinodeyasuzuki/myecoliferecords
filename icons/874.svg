    <path d="M17 26 C17 20 21 16 26 15 L38 15 C43 16 47 20 47 26 L47 30 L17 30 Z" fill="url(#flap)" stroke="#5c1512" stroke-width="1.3"/>
    <rect x="28" y="26" width="8" height="6" rx="1" fill="#7a1c19" stroke="#4a100e" stroke-width="1"/>
