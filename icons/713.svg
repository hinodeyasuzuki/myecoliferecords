<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F6698"/>
      <stop offset="1" stop-color="#1B2747"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#c2c6cc"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a86a"/>
      <stop offset="1" stop-color="#a5713c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4c5c"/>
      <stop offset="1" stop-color="#1c2129"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0b1220" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#0f1830" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="18" y="14" width="28" height="17" rx="1.5" fill="url(#screen)" stroke="#12161c" stroke-width="1.2"/>
    <rect x="30" y="31" width="4" height="3" fill="#3a3d42"/>
    <rect x="10" y="38" width="44" height="14" rx="2.5" fill="url(#wood)" stroke="#4a2f12" stroke-width="1.3"/>
    <line x1="32" y1="38" x2="32" y2="52" stroke="#4a2f12" stroke-width="1"/>
    <circle cx="27" cy="45" r="1.1" fill="#4a2f12"/>
    <circle cx="37" cy="45" r="1.1" fill="#4a2f12"/>
    <rect x="12" y="52" width="3" height="4" fill="#2a2d31"/>
    <rect x="49" y="52" width="3" height="4" fill="#2a2d31"/>
  </g>
</svg>
