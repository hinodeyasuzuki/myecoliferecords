<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87BB9"/>
      <stop offset="1" stop-color="#613461"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0AD84"/>
      <stop offset="1" stop-color="#C9752E"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3a1e3a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#3a1e3a" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="18" fill="url(#ball)" stroke="#3a3d42" stroke-width="1.3"/>
    <path d="M32 14 V50" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M14 32 H50" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M17 20 Q30 32 17 44" fill="none" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M47 20 Q34 32 47 44" fill="none" stroke="#3a3d42" stroke-width="1.2"/>
  </g>
</svg>
