<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB72"/>
      <stop offset="1" stop-color="#B37D1E"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b473"/>
      <stop offset="1" stop-color="#a9713c"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5dcae"/>
      <stop offset="1" stop-color="#e0b877"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4008" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4008" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="17" y="10" width="30" height="44" rx="3" fill="url(#wood)" stroke="#4a2f12" stroke-width="1.3"/>
    <rect x="20" y="14" width="24" height="10" rx="1.5" fill="url(#drawer)" stroke="#4a2f12" stroke-width="1"/>
    <rect x="29" y="18.2" width="6" height="1.8" rx="0.9" fill="#5c4008"/>
    <rect x="20" y="26" width="24" height="10" rx="1.5" fill="url(#drawer)" stroke="#4a2f12" stroke-width="1"/>
    <rect x="29" y="30.2" width="6" height="1.8" rx="0.9" fill="#5c4008"/>
    <rect x="20" y="38" width="24" height="10" rx="1.5" fill="url(#drawer)" stroke="#4a2f12" stroke-width="1"/>
    <rect x="29" y="42.2" width="6" height="1.8" rx="0.9" fill="#5c4008"/>
    <rect x="20" y="54" width="3" height="4" fill="#4a2f12"/>
    <rect x="41" y="54" width="3" height="4" fill="#4a2f12"/>
  </g>
</svg>
