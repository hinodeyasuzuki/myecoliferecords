<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F6698"/>
      <stop offset="1" stop-color="#1B2747"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e9ec"/>
      <stop offset="1" stop-color="#b7bbc2"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0b1220" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#0f1830" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="11" y="9" width="42" height="42" rx="3" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="13" y="12" width="4" height="38" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
    <rect x="47" y="12" width="4" height="38" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
    <g stroke="#7d828a" stroke-width="0.8">
      <rect x="18" y="12" width="28" height="3.6" fill="url(#slat)"/>
      <rect x="18" y="16.4" width="28" height="3.6" fill="url(#slat)"/>
      <rect x="18" y="20.8" width="28" height="3.6" fill="url(#slat)"/>
      <rect x="18" y="25.2" width="28" height="3.6" fill="url(#slat)"/>
      <rect x="18" y="29.6" width="28" height="3.6" fill="url(#slat)"/>
      <rect x="18" y="34" width="28" height="3.6" fill="url(#slat)"/>
      <rect x="18" y="38.4" width="28" height="3.6" fill="url(#slat)"/>
      <rect x="18" y="42.8" width="28" height="3.6" fill="url(#slat)"/>
    </g>
    <rect x="27" y="47.5" width="10" height="4" rx="1.5" fill="#5c6067" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
