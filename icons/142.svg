    <rect x="18" y="12" width="16" height="10" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M26 22 v8 c0 3 -2 4 -5 4" fill="none" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="17" y="34" width="10" height="4" rx="1.5" fill="#c8e3f6" stroke="#3a3d42" stroke-width="1"/>
    <path d="M22 20 v-10" fill="none" stroke="#8a8f98" stroke-width="1"/>
    <rect x="28" y="36" width="18" height="18" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="37" cy="45" r="3" fill="#b87bb9" opacity="0.5" stroke="#3a3d42" stroke-width="0.8"/>
    <line x1="32" y1="50" x2="42" y2="50" stroke="#9aa0aa" stroke-width="1"/>
