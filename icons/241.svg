<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="21" y="9" width="22" height="46" rx="5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="23.5" y="13.5" width="17" height="33" rx="1.5" fill="#20262f" stroke="#12161c" stroke-width="0.8"/>
    <circle cx="32" cy="51" r="2.1" fill="#dfe2e6" stroke="#3a3d42" stroke-width="0.6"/>
    <rect x="28.5" y="11" width="7" height="1.4" rx="0.7" fill="#8a8f98"/>
    <rect x="26" y="19" width="12" height="8" rx="1" fill="#7fa8cc" opacity="0.5"/>
  </g>
</svg>
