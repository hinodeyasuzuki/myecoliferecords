    <path d="M24 22 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#5c2c14" stroke-width="1.6"/>
    <line x1="17" y1="46" x2="43" y2="46" stroke="#3a3d42" stroke-width="1.6"/>
    <line x1="30" y1="46" x2="24" y2="52" stroke="#3a3d42" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="30" y1="46" x2="36" y2="52" stroke="#3a3d42" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="53" r="2.2" fill="#3a3d42"/>
