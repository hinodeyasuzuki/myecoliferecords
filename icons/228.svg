<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB72"/>
      <stop offset="1" stop-color="#B37D1E"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <radialGradient id="blade" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#6b7480"/>
      <stop offset="1" stop-color="#2c3138"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4008" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4008" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="10" width="44" height="44" rx="4" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="32" r="17" fill="#e3e6e9" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="13" fill="url(#blade)" stroke="#1c1f24" stroke-width="1"/>
    <path d="M32 22 q7 3 5 10 q7 -2 8 5 q-6 4 -11 0 q0 7 -6 8 q-4 -6 0 -11 q-7 1 -9 -6 q6 -3 11 0 q0 -7 2 -6 z" fill="#9aa0aa" opacity="0.8"/>
    <circle cx="32" cy="32" r="2.2" fill="#dfe2e6" stroke="#1c1f24" stroke-width="0.8"/>
  </g>
