    <rect x="28" y="38" width="8" height="12" fill="#8fa3b8" stroke="#3a3d42" stroke-width="1"/>
    <rect x="19" y="33" width="7" height="7" fill="#cfe6ef" stroke="#3a3d42" stroke-width="1"/>
