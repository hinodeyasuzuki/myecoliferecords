<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97B8A"/>
      <stop offset="1" stop-color="#7A2E3F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#421a23" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#421a23" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="20" y="10" width="20" height="44" rx="2.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="23" y="14" width="14" height="3" rx="1" fill="#8a8f98"/>
    <circle cx="30" cy="24" r="1.8" fill="#7a2e3f"/>
    <line x1="23" y1="30" x2="37" y2="30" stroke="#9aa0aa" stroke-width="1"/>
    <line x1="23" y1="34" x2="37" y2="34" stroke="#9aa0aa" stroke-width="1"/>
    <line x1="23" y1="38" x2="37" y2="38" stroke="#9aa0aa" stroke-width="1"/>
    <line x1="23" y1="42" x2="37" y2="42" stroke="#9aa0aa" stroke-width="1"/>
    <line x1="23" y1="46" x2="37" y2="46" stroke="#9aa0aa" stroke-width="1"/>
  </g>
</svg>
