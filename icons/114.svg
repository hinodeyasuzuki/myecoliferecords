<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7478C4"/>
      <stop offset="1" stop-color="#2E3170"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="18%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#c2c6cc"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1a1c3f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1a1c3f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="19" y="8" width="26" height="48" rx="3.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <line x1="19" y1="24" x2="45" y2="24" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="30" y="14" width="2.4" height="7" rx="1.2" fill="#9aa0aa" stroke="#3a3d42" stroke-width="0.6"/>
    <rect x="30" y="30" width="2.4" height="9" rx="1.2" fill="#9aa0aa" stroke="#3a3d42" stroke-width="0.6"/>
  </g>
</svg>
