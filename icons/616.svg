<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0AD84"/>
      <stop offset="1" stop-color="#A85830"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c2c14" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2c14" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="18" width="44" height="30" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="16" y="22" width="32" height="8" fill="#eef0f2" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="22" cy="38" r="6" fill="#eef0f2" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="22" cy="38" r="2" fill="#3a3d42"/>
    <circle cx="42" cy="38" r="6" fill="#eef0f2" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="42" cy="38" r="2" fill="#3a3d42"/>
    <line x1="28" y1="38" x2="36" y2="38" stroke="#8a8f98" stroke-width="1"/>
    <circle cx="13" cy="21" r="1" fill="#8a8f98"/>
    <circle cx="51" cy="21" r="1" fill="#8a8f98"/>
    <circle cx="13" cy="45" r="1" fill="#8a8f98"/>
    <circle cx="51" cy="45" r="1" fill="#8a8f98"/>
  </g>
</svg>
