    <rect x="16" y="28" width="2.4" height="12" fill="#ab7642" stroke="#4a3320" stroke-width="0.8"/>
    <rect x="39.6" y="28" width="2.4" height="12" fill="#ab7642" stroke="#4a3320" stroke-width="0.8"/>
    <rect x="45" y="30" width="12" height="12" rx="1.5" fill="url(#wood)" stroke="#4a3320" stroke-width="1.2"/>
    <path d="M46.5 42 l-1.5 8 M56.5 42 l1.5 8" stroke="#4a3320" stroke-width="1.2" fill="none"/>
