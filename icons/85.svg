<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FC4B5"/>
      <stop offset="1" stop-color="#1F6F64"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9adb3"/>
      <stop offset="1" stop-color="#6b6f76"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0d2b26" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#123c35" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="14" y="36" width="36" height="18" rx="4" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <ellipse cx="32" cy="28" rx="18" ry="7" fill="#8a8f98" stroke="#3a3d42" stroke-width="1.3"/>
    <ellipse cx="32" cy="27" rx="12" ry="4" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1"/>
    <g stroke="#5c6067" stroke-width="0.8">
      <line x1="24" y1="24" x2="40" y2="30"/>
      <line x1="40" y1="24" x2="24" y2="30"/>
      <line x1="32" y1="21" x2="32" y2="33"/>
    </g>
    <circle cx="22" cy="27" r="1" fill="#3a3d42"/>
    <circle cx="42" cy="27" r="1" fill="#3a3d42"/>
    <g stroke="#3a3d42" stroke-width="1">
      <line x1="7" y1="42" x2="14" y2="42"/>
      <line x1="7" y1="46" x2="14" y2="46"/>
      <line x1="9" y1="39" x2="9" y2="49"/>
    </g>
  </g>
</svg>
