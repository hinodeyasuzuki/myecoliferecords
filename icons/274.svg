    <path d="M20 24 l2 -10 l2 3 l2 -3 l2 10" fill="none" stroke="#7a2e50" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="41" y="14" width="9" height="16" rx="2" fill="url(#bottle)" stroke="#3a3d42" stroke-width="1.1"/>
    <rect x="44" y="10" width="3" height="5" rx="1" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
