<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97B8A"/>
      <stop offset="1" stop-color="#7A2E3F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#421a23" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#421a23" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <line x1="32" y1="12" x2="32" y2="8" stroke="#3a3d42" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="32" cy="7" r="1.8" fill="#7a2e3f"/>
    <rect x="24" y="12" width="16" height="12" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="29" cy="18" r="1.6" fill="#7a2e3f"/>
    <circle cx="35" cy="18" r="1.6" fill="#7a2e3f"/>
    <rect x="14" y="28" width="6" height="12" rx="2.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <rect x="44" y="28" width="6" height="12" rx="2.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <rect x="21" y="26" width="22" height="18" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="24" y="46" width="7" height="9" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <rect x="33" y="46" width="7" height="9" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
  </g>
</svg>
