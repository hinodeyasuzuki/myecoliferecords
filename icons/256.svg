    <rect x="27" y="12" width="10" height="14" rx="2" fill="#e9ecef" stroke="#3a3d42" stroke-width="1.2"/>
    <path d="M28 12 l1 -4 h6 l1 4 z" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1"/>
    <line x1="30" y1="9.5" x2="30" y2="7.5" stroke="#3a3d42" stroke-width="1"/>
    <line x1="32" y1="9" x2="32" y2="7" stroke="#3a3d42" stroke-width="1"/>
    <line x1="34" y1="9.5" x2="34" y2="7.5" stroke="#3a3d42" stroke-width="1"/>
    <rect x="26" y="25" width="12" height="27" rx="5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="46" r="1.8" fill="#4f6698"/>
