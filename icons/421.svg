<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BC97"/>
      <stop offset="1" stop-color="#566B4F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="disp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4c5c"/>
      <stop offset="1" stop-color="#20262f"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#28351f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#28351f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="14" y="16" width="36" height="10" rx="2" fill="url(#body)" stroke="#28351f" stroke-width="1.2"/>
    <rect x="17" y="18.5" width="14" height="5" fill="url(#disp)"/>
    <circle cx="44" cy="21" r="2.6" fill="#c7ccd1" stroke="#28351f" stroke-width="0.8"/>
    <rect x="14" y="28" width="36" height="10" rx="2" fill="url(#body)" stroke="#28351f" stroke-width="1.2"/>
    <circle cx="20" cy="33" r="3" fill="#e7e9eb" stroke="#28351f" stroke-width="0.9"/>
    <circle cx="30" cy="33" r="3" fill="#e7e9eb" stroke="#28351f" stroke-width="0.9"/>
    <rect x="14" y="40" width="36" height="9" rx="2" fill="url(#body)" stroke="#28351f" stroke-width="1.2"/>
    <rect x="18" y="43" width="28" height="3" rx="1.5" fill="#8a8f98"/>
  </g>
</svg>
