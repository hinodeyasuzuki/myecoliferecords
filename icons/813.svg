    <rect x="39" y="12" width="5" height="4" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
    <path d="M21 16 h22 l2 12 l-1 24 h-9 l-1.5 -22 l-1.5 22 h-9 l-1 -24 z" fill="url(#pants)" stroke="#1a2136" stroke-width="1.2"/>
