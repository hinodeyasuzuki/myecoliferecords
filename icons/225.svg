<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97B8A"/>
      <stop offset="1" stop-color="#7A2E3F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#421a23" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#421a23" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="14" width="32" height="30" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <line x1="21" y1="19" x2="21" y2="39" stroke="#c94e2c" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="19" x2="27" y2="39" stroke="#c94e2c" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="33" y1="19" x2="33" y2="39" stroke="#c94e2c" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="39" y1="19" x2="39" y2="39" stroke="#c94e2c" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <line x1="44" y1="19" x2="44" y2="39" stroke="#9aa0aa" stroke-width="1"/>
    <rect x="21" y="44" width="4" height="8" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
    <rect x="39" y="44" width="4" height="8" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
