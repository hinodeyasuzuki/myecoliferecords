<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97B8A"/>
      <stop offset="1" stop-color="#7A2E3F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#421a23" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#421a23" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="9" y="27" width="46" height="8" rx="4" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <rect x="28.5" y="31" width="7" height="24" rx="3.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="14" cy="31" r="3.4" fill="none" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="50" cy="31" r="3.4" fill="none" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="32" cy="49" r="6.2" fill="#e6e9ec" stroke="#3a3d42" stroke-width="1.2"/>
    <line x1="32" y1="43.5" x2="32" y2="54.5" stroke="#3a3d42" stroke-width="1.1"/>
    <line x1="26.6" y1="49" x2="37.4" y2="49" stroke="#3a3d42" stroke-width="1.1"/>
    <circle cx="32" cy="49" r="2" fill="#c97b8a" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
