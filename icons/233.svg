<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87BB9"/>
      <stop offset="1" stop-color="#613461"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3a1e3a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#3a1e3a" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="11" y="14" width="42" height="18" fill="url(#glow)"/>
    <rect x="12" y="34" width="40" height="7" rx="3.5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="15" y="36.4" width="34" height="2.2" rx="1.1" fill="#fff2b8"/>
    <path d="M18 46 h28" stroke="#9aa0aa" stroke-width="1"/>
    <path d="M22 50 h20" stroke="#9aa0aa" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
