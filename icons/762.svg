<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FAE7A"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#26331c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#26331c" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="10" width="44" height="4" rx="1.5" fill="#4a6339" stroke="#26331c" stroke-width="1.1"/>
    <rect x="13" y="16" width="38" height="4" fill="url(#slat)" stroke="#3a3d42" stroke-width="0.9"/>
    <rect x="13" y="22" width="38" height="4" fill="url(#slat)" stroke="#3a3d42" stroke-width="0.9"/>
    <rect x="13" y="28" width="38" height="4" fill="url(#slat)" stroke="#3a3d42" stroke-width="0.9"/>
    <rect x="13" y="34" width="38" height="4" fill="url(#slat)" stroke="#3a3d42" stroke-width="0.9"/>
    <path d="M13 40 h30" stroke="url(#slat)" stroke-width="4"/>
    <path d="M13 40 h30" stroke="#3a3d42" stroke-width="0.9" fill="none"/>
    <line x1="20" y1="14" x2="20" y2="44" stroke="#9aa0aa" stroke-width="1"/>
    <line x1="20" y1="44" x2="20" y2="52" stroke="#9aa0aa" stroke-width="1"/>
    <circle cx="20" cy="53" r="1.6" fill="#9aa0aa"/>
