<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F6698"/>
      <stop offset="1" stop-color="#1B2747"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc4e0"/>
      <stop offset="1" stop-color="#4f7fa0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0b1220" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#0f1830" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="18" y="42" width="26" height="8" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="20" y="44" width="8" height="4" rx="1" fill="#2c333a"/>
    <rect x="36" y="44" width="8" height="4" rx="1" fill="#2c333a"/>
    <path d="M31 42 L31 22" stroke="#3a3d42" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="31" cy="17" rx="10" ry="7" fill="url(#glass)" stroke="#3a3d42" stroke-width="1.3"/>
    <ellipse cx="28" cy="14.5" rx="3" ry="2" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
