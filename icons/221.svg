    <rect x="14" y="18" width="36" height="28" rx="6" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="26" cy="32" r="9" fill="#3f4c5c" stroke="#20262f" stroke-width="1.1"/>
    <path d="M26 32 l0 -6 M26 32 l5 3 M26 32 l-5 3" stroke="#ff9a6b" stroke-width="1.4" fill="none"/>
    <rect x="40" y="24" width="6" height="4" rx="1" fill="#9aa0aa"/>
    <rect x="40" y="30" width="6" height="4" rx="1" fill="#9aa0aa"/>
    <rect x="40" y="36" width="6" height="4" rx="1" fill="#9aa0aa"/>
