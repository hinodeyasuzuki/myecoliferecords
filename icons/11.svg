<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA07E"/>
      <stop offset="1" stop-color="#C94E2C"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#b7bbc2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff1fb"/>
      <stop offset="1" stop-color="#a9d3e8"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c2312" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2312" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="11" y="9" width="42" height="42" rx="3" fill="url(#frame)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="15" y="13" width="16" height="16" fill="url(#glass)" stroke="#7fa8cc" stroke-width="0.8"/>
    <rect x="33" y="13" width="16" height="16" fill="url(#glass)" stroke="#7fa8cc" stroke-width="0.8"/>
    <rect x="15" y="31" width="16" height="16" fill="url(#glass)" stroke="#7fa8cc" stroke-width="0.8"/>
    <rect x="33" y="31" width="16" height="16" fill="url(#glass)" stroke="#7fa8cc" stroke-width="0.8"/>
    <rect x="30.5" y="9" width="3" height="42" fill="url(#frame)" stroke="#3a3d42" stroke-width="1"/>
    <rect x="11" y="29.5" width="42" height="3" fill="url(#frame)" stroke="#3a3d42" stroke-width="1"/>
    <rect x="11" y="48" width="42" height="3" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
