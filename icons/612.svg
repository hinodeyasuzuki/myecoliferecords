<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87BB9"/>
      <stop offset="1" stop-color="#613461"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="0.5" stop-color="#b9d8e0"/>
      <stop offset="1" stop-color="#9aa0aa"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3a1e3a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#3a1e3a" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="12" width="30" height="40" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="16" y="17" width="22" height="6" fill="#613461"/>
    <circle cx="44" cy="42" r="14" fill="url(#disc)" stroke="#3a3d42" stroke-width="1.2"/>
    <circle cx="44" cy="42" r="4" fill="#eef0f2" stroke="#3a3d42" stroke-width="1"/>
    <circle cx="44" cy="42" r="1.4" fill="#3a3d42"/>
  </g>
</svg>
