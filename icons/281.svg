    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#26331c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#26331c" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="32" cy="34" r="18" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="34" r="14" fill="#f6f7f8" stroke="#9aa0aa" stroke-width="0.8"/>
    <line x1="32" y1="34" x2="32" y2="24" stroke="#3a3d42" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="32" y1="34" x2="39" y2="37" stroke="#3a3d42" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="1.6" fill="#3a3d42"/>
    <path d="M20 20 l-5 -7" stroke="#8a8f98" stroke-width="2" stroke-linecap="round"/>
    <path d="M44 20 l5 -7" stroke="#8a8f98" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="15" cy="12" rx="3" ry="2.2" fill="#dfe2e6" stroke="#3a3d42" stroke-width="0.8"/>
    <ellipse cx="49" cy="12" rx="3" ry="2.2" fill="#dfe2e6" stroke="#3a3d42" stroke-width="0.8"/>
