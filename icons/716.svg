<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7478C4"/>
      <stop offset="1" stop-color="#2E3170"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f1f4"/>
      <stop offset="1" stop-color="#c5c9d4"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1a1c3f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1a1c3f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="18" width="8" height="26" rx="3" fill="url(#fab)" stroke="#3a3d42" stroke-width="1.2"/>
    <rect x="44" y="18" width="8" height="26" rx="3" fill="url(#fab)" stroke="#3a3d42" stroke-width="1.2"/>
    <rect x="14" y="14" width="36" height="12" rx="3" fill="url(#fab)" stroke="#3a3d42" stroke-width="1.2"/>
    <rect x="12" y="30" width="40" height="14" rx="3" fill="url(#fab)" stroke="#3a3d42" stroke-width="1.2"/>
    <line x1="30" y1="30" x2="30" y2="44" stroke="#9aa0aa" stroke-width="1"/>
    <line x1="12" y1="52" x2="12" y2="46" stroke="#3a3d42" stroke-width="2"/>
    <line x1="52" y1="52" x2="52" y2="46" stroke="#3a3d42" stroke-width="2"/>
  </g>
</svg>
