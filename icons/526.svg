<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BC97"/>
      <stop offset="1" stop-color="#566B4F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#28351f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#28351f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <ellipse cx="26" cy="26" rx="12" ry="13" fill="#C94E2C" stroke="#3a3d42" stroke-width="1.3"/>
    <ellipse cx="26" cy="26" rx="9" ry="10" fill="#1c1c1c"/>
    <rect x="21" y="37" width="9" height="12" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1" transform="rotate(15 25.5 43)"/>
    <circle cx="46" cy="42" r="5" fill="#f6f7f8" stroke="#3a3d42" stroke-width="1"/>
  </g>
</svg>
