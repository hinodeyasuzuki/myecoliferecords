<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87BB9"/>
      <stop offset="1" stop-color="#613461"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3a1e3a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#3a1e3a" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="27" cy="30" r="15" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="27" cy="30" r="9" fill="#e3e6e9" stroke="#9aa0aa" stroke-width="0.8"/>
    <circle cx="27" cy="30" r="3" fill="#3a3d42"/>
    <path d="M38 40 h14 v6 h-14 z" fill="#f0c868" stroke="#3a3d42" stroke-width="1.1"/>
    <line x1="42" y1="40" x2="42" y2="46" stroke="#3a3d42" stroke-width="0.8"/>
    <line x1="46" y1="40" x2="46" y2="46" stroke="#3a3d42" stroke-width="0.8"/>
    <line x1="50" y1="40" x2="50" y2="46" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
