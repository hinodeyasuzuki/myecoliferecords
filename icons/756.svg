<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CB93B4"/>
      <stop offset="1" stop-color="#7A4468"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f0f6"/>
      <stop offset="1" stop-color="#e0c6da"/>
    </linearGradient>
    <linearGradient id="pil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcc6d4"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#472339" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#472339" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="14" y="30" width="36" height="20" rx="8" fill="url(#quilt)" stroke="#7A4468" stroke-width="1.3"/>
    <path d="M14 38 q18 5 36 0" fill="none" stroke="#cb93b4" stroke-width="1"/>
    <ellipse cx="24" cy="20" rx="12" ry="8" fill="url(#pil)" stroke="#3a3d42" stroke-width="1.2"/>
  </g>
</svg>
