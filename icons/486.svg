<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FC4B5"/>
      <stop offset="1" stop-color="#1F6F64"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0d2b26" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#123c35" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <line x1="22" y1="35" x2="18" y2="50" stroke="#3a3d42" stroke-width="1.6"/>
    <line x1="42" y1="33" x2="46" y2="50" stroke="#3a3d42" stroke-width="1.6"/>
    <line x1="32" y1="42" x2="32" y2="50" stroke="#3a3d42" stroke-width="1.6"/>
    <circle cx="22" cy="26" r="9" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="22" cy="26" r="5.5" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="42" cy="26" r="7" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="42" cy="26" r="4" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="32" cy="42" r="7" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="42" r="4" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
