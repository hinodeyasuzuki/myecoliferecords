<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3B8"/>
      <stop offset="1" stop-color="#455A72"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#233040" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#233040" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="18" y="10" width="28" height="18" fill="#f6f7f8" stroke="#3a3d42" stroke-width="1"/>
    <line x1="22" y1="15" x2="42" y2="15" stroke="#c7ccd1" stroke-width="1"/>
    <line x1="22" y1="19" x2="42" y2="19" stroke="#c7ccd1" stroke-width="1"/>
    <line x1="22" y1="23" x2="36" y2="23" stroke="#c7ccd1" stroke-width="1"/>
    <rect x="12" y="24" width="40" height="26" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <path d="M12 24 l20 16 l20 -16" fill="none" stroke="#3a3d42" stroke-width="1.3"/>
  </g>
</svg>
