    <path d="M32 28 l6 -9 6 9 z" fill="#c98f45" stroke="#7a5222" stroke-width="1.2"/>
    <circle cx="47" cy="43" r="7" fill="#f0c07a" stroke="#7a5222" stroke-width="1.3"/>
