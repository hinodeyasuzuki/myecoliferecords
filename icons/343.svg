<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FAE7A"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9dcb6"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#26331c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#26331c" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <path d="M32 26 l16 12 -8 12 h-16 l-8 -12z" fill="url(#cloth)" stroke="#26331c" stroke-width="1.3"/>
    <path d="M18 30 l14 -8 14 8" fill="none" stroke="#26331c" stroke-width="1.1"/>
    <path d="M28 26 q4 -6 8 0" fill="none" stroke="#26331c" stroke-width="1.3"/>
    <circle cx="32" cy="23" r="2" fill="#fff" stroke="#26331c" stroke-width="0.8"/>
  </g>
</svg>
