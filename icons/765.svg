    <path d="M9 26 q26 8 46 0" fill="none" stroke="#f0c3cb" stroke-width="1"/>
    <rect x="14" y="14" width="36" height="4" rx="1.5" fill="url(#wood)" stroke="#4a3320" stroke-width="1.1"/>
    <line x1="16" y1="18" x2="16" y2="30" stroke="#a06f3d" stroke-width="2"/>
    <line x1="48" y1="18" x2="48" y2="30" stroke="#a06f3d" stroke-width="2"/>
