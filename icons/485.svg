<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97B8A"/>
      <stop offset="1" stop-color="#7A2E3F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#421a23" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#421a23" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="26" width="44" height="20" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="17" cy="30" r="2" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="25" cy="30" r="2" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="33" cy="30" r="2" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="41" cy="30" r="2" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="49" cy="30" r="2" fill="#e7e9eb" stroke="#3a3d42" stroke-width="0.8"/>
    <rect x="13" y="34" width="38" height="10" fill="#f6f7f8" stroke="#3a3d42" stroke-width="1"/>
    <rect x="20" y="34" width="3" height="6" fill="#20232a"/>
    <rect x="27" y="34" width="3" height="6" fill="#20232a"/>
    <rect x="38" y="34" width="3" height="6" fill="#20232a"/>
    <rect x="45" y="34" width="3" height="6" fill="#20232a"/>
