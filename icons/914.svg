    <path d="M16 49 L44 49" stroke="#3a3d42" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M44 49 L44 16" stroke="#3a3d42" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M35 18 L50 18" stroke="#3a3d42" stroke-width="3" stroke-linecap="round"/>
