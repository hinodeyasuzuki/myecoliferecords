<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7478C4"/>
      <stop offset="1" stop-color="#2E3170"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1a1c3f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1a1c3f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="24" y="10" width="16" height="4" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <rect x="24" y="50" width="16" height="4" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <rect x="30" y="14" width="4" height="36" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
    <line x1="24" y1="10" x2="24" y2="14" stroke="#3a3d42" stroke-width="1"/>
    <line x1="40" y1="10" x2="40" y2="14" stroke="#3a3d42" stroke-width="1"/>
    <line x1="24" y1="50" x2="24" y2="54" stroke="#3a3d42" stroke-width="1"/>
    <line x1="40" y1="50" x2="40" y2="54" stroke="#3a3d42" stroke-width="1"/>
  </g>
</svg>
