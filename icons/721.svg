<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FAE7A"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b478"/>
      <stop offset="1" stop-color="#a06f3d"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f2f4"/>
      <stop offset="1" stop-color="#b7d2d6"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#26331c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#26331c" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <ellipse cx="32" cy="16" rx="9" ry="11" fill="url(#mirror)" stroke="#4a3320" stroke-width="1.3"/>
    <rect x="30.5" y="21" width="3" height="8" fill="#a06f3d" stroke="#4a3320" stroke-width="0.8"/>
    <rect x="14" y="29" width="36" height="24" rx="3" fill="url(#wood)" stroke="#4a3320" stroke-width="1.3"/>
    <rect x="17" y="32.5" width="30" height="7" rx="1.5" fill="#f5dcae" stroke="#4a3320" stroke-width="1"/>
    <rect x="30" y="35.4" width="4" height="1.6" rx="0.8" fill="#4a3320"/>
    <rect x="17" y="41.5" width="30" height="7" rx="1.5" fill="#f5dcae" stroke="#4a3320" stroke-width="1"/>
    <rect x="30" y="44.4" width="4" height="1.6" rx="0.8" fill="#4a3320"/>
    <rect x="16" y="53" width="3" height="4" fill="#4a3320"/>
    <rect x="45" y="53" width="3" height="4" fill="#4a3320"/>
  </g>
</svg>
