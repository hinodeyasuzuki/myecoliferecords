<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3B8"/>
      <stop offset="1" stop-color="#455A72"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#233040" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#233040" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="12" width="40" height="40" rx="5" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="34" r="13" fill="#2c3e6b" stroke="#1b2747" stroke-width="1.3"/>
    <circle cx="32" cy="34" r="9.5" fill="#4a5f92" stroke="#1b2747" stroke-width="1"/>
    <circle cx="17" cy="17" r="1.6" fill="#9aa0aa"/>
    <circle cx="23" cy="17" r="1.6" fill="#9aa0aa"/>
    <path d="M28 30 q4 4 8 0" fill="none" stroke="#8ea6d6" stroke-width="1.2"/>
  </g>
</svg>
