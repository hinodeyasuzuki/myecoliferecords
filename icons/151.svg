<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <ellipse cx="24" cy="42" rx="16" ry="6" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <ellipse cx="24" cy="40" rx="10" ry="3.2" fill="#e7e9eb" stroke="#3a3d42" stroke-width="1"/>
    <path d="M42 20 h8 v20 a4 4 0 0 1 -8 0 z" fill="#dfeef4" stroke="#3a3d42" stroke-width="1.1" opacity="0.85"/>
    <ellipse cx="46" cy="20" rx="4" ry="1.6" fill="#eef7fa" stroke="#3a3d42" stroke-width="1"/>
  </g>
</svg>
