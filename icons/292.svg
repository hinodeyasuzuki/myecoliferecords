<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FC4B5"/>
      <stop offset="1" stop-color="#1F6F64"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0d2b26" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#123c35" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="17" y="18" width="24" height="30" rx="4" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <line x1="24" y1="16" x2="24" y2="10" stroke="#8a8f98" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="30" y1="16" x2="30" y2="10" stroke="#8a8f98" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M41 34 q10 3 10 12" fill="none" stroke="#3a3d42" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="49" y="45" width="6" height="5" rx="1.3" fill="#eef0f2" stroke="#3a3d42" stroke-width="0.9"/>
    <circle cx="29" cy="34" r="2.2" fill="#5cd66b"/>
  </g>
</svg>
