<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FAE7A"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b57a"/>
      <stop offset="1" stop-color="#ab7a3f"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#26331c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#26331c" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="26" width="44" height="16" rx="8" fill="url(#wood3)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="16" y="30" width="32" height="8" rx="4" fill="none" stroke="#8a5a24" stroke-width="1"/>
    <ellipse cx="10" cy="34" rx="3" ry="4" fill="none" stroke="#3a3d42" stroke-width="1.2"/>
    <ellipse cx="54" cy="34" rx="3" ry="4" fill="none" stroke="#3a3d42" stroke-width="1.2"/>
  </g>
</svg>
