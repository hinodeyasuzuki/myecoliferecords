<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BC97"/>
      <stop offset="1" stop-color="#566B4F"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6e8"/>
      <stop offset="1" stop-color="#aab0b8"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#28351f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#28351f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="15" y="30" width="12" height="18" rx="1.5" fill="url(#can)" stroke="#28351f" stroke-width="1.2"/>
    <rect x="15" y="35" width="12" height="6" fill="#8FAE7A" opacity="0.8"/>
    <rect x="29" y="26" width="12" height="22" rx="1.5" fill="url(#can)" stroke="#28351f" stroke-width="1.2"/>
    <rect x="29" y="32" width="12" height="6" fill="#566B4F" opacity="0.8"/>
    <rect x="43" y="32" width="10" height="16" rx="1.5" fill="url(#can)" stroke="#28351f" stroke-width="1.2"/>
    <rect x="43" y="37" width="10" height="5" fill="#A3BC97" opacity="0.8"/>
  </g>
</svg>
