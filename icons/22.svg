<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA07E"/>
      <stop offset="1" stop-color="#C94E2C"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c2312" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2312" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="16" width="40" height="34" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <line x1="12" y1="25" x2="52" y2="25" stroke="#8b6b4a" stroke-width="1"/>
    <line x1="12" y1="33" x2="52" y2="33" stroke="#8b6b4a" stroke-width="1"/>
    <line x1="12" y1="41" x2="52" y2="41" stroke="#8b6b4a" stroke-width="1"/>
    <line x1="24" y1="16" x2="24" y2="25" stroke="#8b6b4a" stroke-width="0.8"/>
    <line x1="40" y1="25" x2="40" y2="33" stroke="#8b6b4a" stroke-width="0.8"/>
    <line x1="20" y1="33" x2="20" y2="41" stroke="#8b6b4a" stroke-width="0.8"/>
    <line x1="36" y1="41" x2="36" y2="50" stroke="#8b6b4a" stroke-width="0.8"/>
    <line x1="30" y1="16" x2="30" y2="25" stroke="#8b6b4a" stroke-width="0.8"/>
    <line x1="44" y1="41" x2="44" y2="50" stroke="#8b6b4a" stroke-width="0.8"/>
  </g>
</svg>
