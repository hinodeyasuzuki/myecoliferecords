    <rect x="13" y="16" width="38" height="30" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="17" y="20" width="18" height="18" rx="2" fill="#2c333b" stroke="#12161c" stroke-width="1"/>
    <path d="M20 34 q6 -10 12 0 z" fill="#e6c97a" opacity="0.85"/>
    <rect x="39" y="21" width="9" height="9" rx="1.5" fill="#e6e9ec" stroke="#3a3d42" stroke-width="0.8"/>
    <rect x="39" y="32" width="9" height="6" rx="1.5" fill="#e6e9ec" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
