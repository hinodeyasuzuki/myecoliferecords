<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C868"/>
      <stop offset="1" stop-color="#C4922A"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe6ab"/>
      <stop offset="1" stop-color="#C4922A"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4108" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4108" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="36" width="32" height="9" rx="2" fill="url(#towel)" stroke="#5c4108" stroke-width="1.2"/>
    <rect x="18" y="26" width="28" height="9" rx="2" fill="url(#towel)" stroke="#5c4108" stroke-width="1.2"/>
    <rect x="20" y="16" width="24" height="9" rx="2" fill="url(#towel)" stroke="#5c4108" stroke-width="1.2"/>
    <line x1="20" y1="30" x2="46" y2="30" stroke="#5c4108" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="20" x2="44" y2="20" stroke="#5c4108" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>
