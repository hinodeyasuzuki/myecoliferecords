  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2312" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <ellipse cx="30" cy="26" rx="16" ry="14" fill="url(#fan)" stroke="#5c2312" stroke-width="1.3"/>
    <path d="M30 12 v28 M18 18 l24 16 M42 18 l-24 16" stroke="#5c2312" stroke-width="0.8" opacity="0.6"/>
    <rect x="28" y="38" width="4" height="16" rx="2" fill="url(#body)" stroke="#3a3d42" stroke-width="1.1"/>
