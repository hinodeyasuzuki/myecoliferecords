<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87BB9"/>
      <stop offset="1" stop-color="#613461"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3a1e3a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#3a1e3a" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="24" width="40" height="18" rx="3" fill="url(#body)" stroke="#3a1e3a" stroke-width="1.3"/>
    <circle cx="22" cy="33" r="5" fill="#e7e9eb" stroke="#3a1e3a" stroke-width="1"/>
    <line x1="22" y1="33" x2="22" y2="29" stroke="#3a1e3a" stroke-width="1.2"/>
    <circle cx="34" cy="33" r="5" fill="#e7e9eb" stroke="#3a1e3a" stroke-width="1"/>
    <line x1="34" y1="33" x2="37" y2="30" stroke="#3a1e3a" stroke-width="1.2"/>
    <rect x="44" y="29" width="4" height="8" rx="1" fill="#B87BB9" stroke="#3a1e3a" stroke-width="0.8"/>
  </g>
</svg>
