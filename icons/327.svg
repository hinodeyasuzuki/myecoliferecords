    <rect x="14" y="30" width="36" height="6" fill="#a83c1f"/>
    <path d="M24 30 v-6 a2 2 0 0 1 2 -2 h12 a2 2 0 0 1 2 2 v6" fill="none" stroke="#5c2312" stroke-width="2"/>
