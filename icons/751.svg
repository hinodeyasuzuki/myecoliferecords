    <circle cx="20" cy="30" r="1.3" fill="#9aa0aa"/>
    <circle cx="32" cy="30" r="1.3" fill="#9aa0aa"/>
    <circle cx="44" cy="30" r="1.3" fill="#9aa0aa"/>
