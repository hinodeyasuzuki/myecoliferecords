    <circle cx="32" cy="38" r="1.3" fill="#9aa0aa"/>
    <circle cx="44" cy="38" r="1.3" fill="#9aa0aa"/>
    <path d="M14 44 h36 l2 4 h-40 z" fill="#c7ccd1" stroke="#3a3d42" stroke-width="1"/>
