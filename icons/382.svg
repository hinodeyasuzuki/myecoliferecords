<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FAE7A"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9dcb6"/>
      <stop offset="1" stop-color="#4A6339"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#26331c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#26331c" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="18" width="22" height="22" rx="2" fill="url(#patch)" stroke="#26331c" stroke-width="1.2" transform="rotate(-8 27 29)"/>
    <path d="M18 22 l18 18 M36 22 l-18 18" stroke="#26331c" stroke-width="0.8" stroke-dasharray="2 2" transform="rotate(-8 27 29)"/>
    <circle cx="44" cy="42" r="7" fill="#e7e9eb" stroke="#26331c" stroke-width="1.2"/>
    <circle cx="41.5" cy="39.5" r="1" fill="#26331c"/>
    <circle cx="46.5" cy="39.5" r="1" fill="#26331c"/>
    <circle cx="41.5" cy="44.5" r="1" fill="#26331c"/>
    <circle cx="46.5" cy="44.5" r="1" fill="#26331c"/>
  </g>
