<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7478C4"/>
      <stop offset="1" stop-color="#2E3170"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1a1c3f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1a1c3f" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <circle cx="22" cy="32" r="9" fill="none" stroke="url(#body)" stroke-width="4"/>
    <circle cx="22" cy="32" r="9" fill="none" stroke="#1a1c3f" stroke-width="1"/>
    <circle cx="42" cy="32" r="9" fill="none" stroke="url(#body)" stroke-width="4"/>
    <circle cx="42" cy="32" r="9" fill="none" stroke="#1a1c3f" stroke-width="1"/>
    <path d="M31 30 q1 -3 3 0" fill="none" stroke="#1a1c3f" stroke-width="2"/>
    <path d="M13 30 l-4 -3" stroke="#1a1c3f" stroke-width="2" stroke-linecap="round"/>
    <path d="M51 30 l4 -3" stroke="#1a1c3f" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
