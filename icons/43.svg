<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0AD84"/>
      <stop offset="1" stop-color="#A85830"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c2c14" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2c14" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="24" y="12" width="16" height="34" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="27" y="16" width="10" height="10" rx="1.2" fill="#20262f" stroke="#12161c" stroke-width="1"/>
    <circle cx="32" cy="21" r="2.6" fill="#7cf0c2" opacity="0.85"/>
    <path d="M40 30 q7 0 7 7 v8" fill="none" stroke="#3a3d42" stroke-width="2"/>
    <path d="M47 45 l4 6 h-4 l4 6" fill="none" stroke="#3a3d42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="46" width="24" height="5" rx="1.5" fill="#8a8f98" stroke="#3a3d42" stroke-width="1"/>
  </g>
</svg>
