<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8CC"/>
      <stop offset="1" stop-color="#305674"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f3f5"/>
      <stop offset="1" stop-color="#c2c6cc"/>
    </linearGradient>
    <radialGradient id="drum" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#6b7480"/>
      <stop offset="1" stop-color="#2c3138"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#1c3547" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#1c3547" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="10" y="10" width="44" height="44" rx="4" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="14" y="14" width="36" height="6" rx="2" fill="#e3e6e9" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="18" cy="17" r="1.2" fill="#2c3e6b"/>
    <circle cx="23" cy="17" r="1.2" fill="#8a8f98"/>
    <circle cx="32" cy="35" r="14" fill="#dfe2e6" stroke="#3a3d42" stroke-width="1.3"/>
    <circle cx="32" cy="35" r="10.5" fill="url(#drum)" stroke="#1c1f24" stroke-width="1"/>
    <circle cx="32" cy="35" r="6.5" fill="none" stroke="#8a8f98" stroke-width="1" opacity="0.6"/>
    <ellipse cx="28" cy="30" rx="4" ry="2.2" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
