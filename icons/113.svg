<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0AD84"/>
      <stop offset="1" stop-color="#A85830"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#c7ccd1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c2c14" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c2c14" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="24" width="40" height="18" rx="3" fill="url(#body)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="17" y="28" width="30" height="10" rx="1.5" fill="#2c2f33" stroke="#3a3d42" stroke-width="1"/>
    <line x1="21" y1="28" x2="21" y2="38" stroke="#4a4e54" stroke-width="1"/>
    <line x1="27" y1="28" x2="27" y2="38" stroke="#4a4e54" stroke-width="1"/>
    <line x1="33" y1="28" x2="33" y2="38" stroke="#4a4e54" stroke-width="1"/>
    <line x1="39" y1="28" x2="39" y2="38" stroke="#4a4e54" stroke-width="1"/>
    <rect x="12" y="30" width="6" height="6" rx="2" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
    <rect x="46" y="30" width="6" height="6" rx="2" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
    <circle cx="32" cy="45" r="2.4" fill="#e6e9ec" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
