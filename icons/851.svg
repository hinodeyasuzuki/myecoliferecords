<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB72"/>
      <stop offset="1" stop-color="#B37D1E"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a3a"/>
      <stop offset="1" stop-color="#3a2d21"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5644"/>
      <stop offset="1" stop-color="#463527"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4008" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4008" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <path d="M20 40 C20 27 24 17 32 17 C40 17 44 27 44 40 Z" fill="url(#crown)" stroke="#241b13" stroke-width="1.3"/>
    <rect x="19" y="37" width="26" height="5" rx="1" fill="#F5CB72" stroke="#241b13" stroke-width="1"/>
    <ellipse cx="32" cy="45" rx="23" ry="6.5" fill="url(#brim)" stroke="#241b13" stroke-width="1.3"/>
    <ellipse cx="32" cy="44" rx="19" ry="4.5" fill="none" stroke="#2c221a" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
