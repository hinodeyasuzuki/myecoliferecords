<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C868"/>
      <stop offset="1" stop-color="#C4922A"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5713f"/>
      <stop offset="1" stop-color="#6b4326"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4108" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4108" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="12" width="40" height="40" rx="3" fill="url(#cover)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="18" y="18" width="28" height="20" fill="#f6f7f8" stroke="#3a3d42" stroke-width="1"/>
    <rect x="21" y="21" width="10" height="7" fill="#8fd6f0"/>
    <rect x="33" y="21" width="10" height="7" fill="#e8b06a"/>
    <path d="M18 18 l4 0 l0 4 z" fill="#c7ccd1"/>
    <line x1="20" y1="42" x2="44" y2="42" stroke="#f0e0c0" stroke-width="1"/>
    <line x1="20" y1="46" x2="38" y2="46" stroke="#f0e0c0" stroke-width="1"/>
  </g>
</svg>
