<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB72"/>
      <stop offset="1" stop-color="#B37D1E"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#b7bbc2"/>
    </linearGradient>
    <clipPath id="meshclip">
      <rect x="14" y="12" width="36" height="36" rx="1"/>
    </clipPath>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c4008" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#chip)" stroke="#5c4008" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#hl)"/>

  <g filter="url(#shadow)">
    <rect x="11" y="9" width="42" height="42" rx="3" fill="url(#frame)" stroke="#3a3d42" stroke-width="1.3"/>
    <rect x="14" y="12" width="36" height="36" fill="#eef4ee"/>
    <g clip-path="url(#meshclip)" stroke="#9fb08c" stroke-width="0.6" opacity="0.85">
      <line x1="10" y1="12" x2="30" y2="52"/>
      <line x1="16" y1="12" x2="36" y2="52"/>
      <line x1="22" y1="12" x2="42" y2="52"/>
      <line x1="28" y1="12" x2="48" y2="52"/>
      <line x1="34" y1="12" x2="54" y2="52"/>
      <line x1="40" y1="12" x2="60" y2="52"/>
      <line x1="10" y1="52" x2="30" y2="12"/>
      <line x1="16" y1="52" x2="36" y2="12"/>
      <line x1="22" y1="52" x2="42" y2="12"/>
      <line x1="28" y1="52" x2="48" y2="12"/>
      <line x1="34" y1="52" x2="54" y2="12"/>
      <line x1="40" y1="52" x2="60" y2="12"/>
    </g>
    <rect x="14" y="12" width="36" height="36" fill="none" stroke="#3a3d42" stroke-width="1"/>
    <rect x="11" y="48" width="42" height="3" fill="#8a8f98" stroke="#3a3d42" stroke-width="0.8"/>
  </g>
</svg>
